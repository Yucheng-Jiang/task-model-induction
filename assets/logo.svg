<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-labelledby="t d">
  <title id="t">Task Model Induction</title>
  <desc id="d">An objective hierarchy induced from a raw computer-use trace.</desc>

  <!-- induced task model: objectives over control flow -->
  <g fill="none" stroke="#57606A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M48 18 V27"/><path d="M26 27 H70"/><path d="M26 27 V34"/><path d="M70 27 V34"/>
    <path d="M26 47 V53"/><path d="M15 53 H37"/><path d="M15 53 V59"/><path d="M37 53 V59"/>
    <path d="M70 47 V59"/>
  </g>
  <g fill="#57606A">
    <circle cx="48" cy="12" r="6.5"/>
    <circle cx="26" cy="41" r="6"/><circle cx="70" cy="41" r="6"/>
    <circle cx="15" cy="64" r="5"/><circle cx="37" cy="64" r="5"/><circle cx="70" cy="64" r="5"/>
  </g>

  <!-- the raw trace the model is grounded in -->
  <g stroke="#9CA3AF" stroke-width="4.5" stroke-linecap="round">
    <path d="M15 88 V80"/><path d="M26 88 V74"/><path d="M37 88 V84"/>
    <path d="M48 88 V76"/><path d="M59 88 V85"/><path d="M70 88 V78"/><path d="M81 88 V83"/>
  </g>
</svg>
